<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&display=swap">
  <style>
    body { margin: 0; }
    .gd { font-family: 'Geist', system-ui, -apple-system, sans-serif; }
    .gd * { box-sizing: border-box; margin: 0; padding: 0; }
    a { color: #e5e5e5; } a:hover { color: #fafafa; }
  </style>
</helmet>

<div class="gd" style="width: 850px; height: 540px; background: #111111; color: #fafafa; padding: 24px; display: flex; gap: 50px;">

  <div style="width: 375px; display: flex; flex-direction: column; gap: 10px;">
    <div style="display: flex; align-items: center; gap: 6px;">
      <span style="font-size: 11px; line-height: 16px; color: oklch(0.704 0.191 22.216); border: 1px solid oklch(0.704 0.191 22.216 / 0.4); border-radius: 9999px; padding: 2px 8px;">現行</span>
      <span style="font-size: 11px; line-height: 16px; color: #a1a1a1;">本番の出題画面と同じ質感。「ここで回答するのか」と誤認される</span>
    </div>

    <div style="display: flex; flex-direction: column; gap: 8px;">
      <div style="border-radius: 14px; background: #262626; border: 1px solid rgba(255, 255, 255, 0.1); padding: 12px; text-align: center;">
        <p style="font-size: 12px; line-height: 16px; color: #a1a1a1; margin-bottom: 4px;">この市区町村はどの都道府県？</p>
        <p style="font-size: 20px; line-height: 28px; font-weight: 700;">東京駅</p>
      </div>
      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px;">
        <div style="border-radius: 10px; border: 2px solid #e5e5e5; background: rgba(229, 229, 229, 0.1); color: #e5e5e5; padding: 10px 0; text-align: center; font-size: 14px; line-height: 20px; font-weight: 500;">東京都</div>
        <div style="border-radius: 10px; border: 2px solid rgba(255, 255, 255, 0.1); background: #262626; padding: 10px 0; text-align: center; font-size: 14px; line-height: 20px; font-weight: 500;">大阪府</div>
        <div style="border-radius: 10px; border: 2px solid rgba(255, 255, 255, 0.1); background: #262626; padding: 10px 0; text-align: center; font-size: 14px; line-height: 20px; font-weight: 500;">神奈川県</div>
        <div style="border-radius: 10px; border: 2px solid rgba(255, 255, 255, 0.1); background: #262626; padding: 10px 0; text-align: center; font-size: 14px; line-height: 20px; font-weight: 500;">千葉県</div>
      </div>
    </div>

    <p style="font-size: 11px; line-height: 17px; color: #a1a1a1; margin-top: 4px;">実体は静的表示だが、正解色まで再現しているため「回答済みの本番画面」に見える。</p>
  </div>

  <div style="width: 375px; display: flex; flex-direction: column; gap: 10px;">
    <div style="display: flex; align-items: center; gap: 6px;">
      <span style="font-size: 11px; line-height: 16px; color: #22c55e; border: 1px solid rgba(34, 197, 94, 0.4); border-radius: 9999px; padding: 2px 8px;">改善後</span>
      <span style="font-size: 11px; line-height: 16px; color: #a1a1a1;">中身は無変更。外側にラッパー1枚を被せるだけ</span>
    </div>

    <div style="border: 1px dashed rgba(255, 255, 255, 0.22); border-radius: 14px; background: rgba(64, 64, 64, 0.1); padding: 12px;">
      <div style="display: flex; align-items: center; gap: 6px; margin-bottom: 8px;">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#a1a1a1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0;"><rect width="18" height="18" x="3" y="3" rx="2"></rect><circle cx="9" cy="9" r="2"></circle><path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21"></path></svg>
        <span style="font-size: 11px; line-height: 16px; color: #a1a1a1; letter-spacing: 0.02em;">プレイ画面イメージ（操作できません）</span>
      </div>

      <div style="display: flex; flex-direction: column; gap: 8px; opacity: 0.85; pointer-events: none; user-select: none;">
        <div style="border-radius: 14px; background: #262626; border: 1px solid rgba(255, 255, 255, 0.1); padding: 12px; text-align: center;">
          <p style="font-size: 12px; line-height: 16px; color: #a1a1a1; margin-bottom: 4px;">この市区町村はどの都道府県？</p>
          <p style="font-size: 20px; line-height: 28px; font-weight: 700;">東京駅</p>
        </div>
        <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px;">
          <div style="border-radius: 10px; border: 2px solid #e5e5e5; background: rgba(229, 229, 229, 0.1); color: #e5e5e5; padding: 10px 0; text-align: center; font-size: 14px; line-height: 20px; font-weight: 500;">東京都</div>
          <div style="border-radius: 10px; border: 2px solid rgba(255, 255, 255, 0.1); background: #262626; padding: 10px 0; text-align: center; font-size: 14px; line-height: 20px; font-weight: 500;">大阪府</div>
          <div style="border-radius: 10px; border: 2px solid rgba(255, 255, 255, 0.1); background: #262626; padding: 10px 0; text-align: center; font-size: 14px; line-height: 20px; font-weight: 500;">神奈川県</div>
          <div style="border-radius: 10px; border: 2px solid rgba(255, 255, 255, 0.1); background: #262626; padding: 10px 0; text-align: center; font-size: 14px; line-height: 20px; font-weight: 500;">千葉県</div>
        </div>
      </div>
    </div>

    <p style="font-size: 11px; line-height: 17px; color: #a1a1a1; margin-top: 4px;">破線枠・ラベル・減光・<code style="font-family: ui-monospace, monospace; font-size: 10px;">pointer-events-none</code> の4点。<br>ModePreviewA〜D の4ファイルは触らないので、モードを増やしても崩れない。</p>
  </div>
</div>
</x-dc>
</body>
</html>
