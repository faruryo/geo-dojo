<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- 背景グラデーション -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#1e1e24" />
      <stop offset="100%" stop-color="#111111" />
    </radialGradient>
    
    <!-- ピンのグラデーション -->
    <linearGradient id="pinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>

    <!-- センターサークル（日輪・コア） -->
    <linearGradient id="coreGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#e11d48" />
    </linearGradient>

    <!-- シャドウ -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#2563eb" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- 背景（全域） -->
  <rect width="512" height="512" fill="url(#bgGrad)" />

  <!-- 背景の同心円グリッド（レーダー / ターゲット感） -->
  <circle cx="256" cy="240" r="180" fill="none" stroke="#ffffff" stroke-opacity="0.04" stroke-width="2" />
  <circle cx="256" cy="240" r="130" fill="none" stroke="#ffffff" stroke-opacity="0.05" stroke-width="2" />
  <circle cx="256" cy="240" r="80" fill="none" stroke="#ffffff" stroke-opacity="0.06" stroke-width="1.5" />

  <!-- マップピン（セーフエリア内 512x512 の中央） -->
  <g filter="url(#glow)">
    <!-- ピン本体 -->
    <path d="M256 100 C180 100 118 162 118 238 C118 335 238 430 248 438 C253 442 259 442 264 438 C274 430 394 335 394 238 C394 162 332 100 256 100 Z" 
          fill="url(#pinGrad)" />
    
    <!-- ピンの白いインナーリング -->
    <circle cx="256" cy="236" r="64" fill="#ffffff" />
    
    <!-- 中央の赤い日章コア（日本・道場・的の象徴） -->
    <circle cx="256" cy="236" r="44" fill="url(#coreGrad)" />
    
    <!-- ターゲットの十字線（繊細な白） -->
    <path d="M256 182 L256 196 M256 276 L256 290 M202 236 L216 236 M296 236 L310 236" 
          stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" opacity="0.9" />
  </g>
</svg>
